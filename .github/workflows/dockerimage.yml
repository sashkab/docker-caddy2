name: Build caddy2 image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 12 * * 5"

jobs:
  test_and_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and test image
        run: |
          set -e
          docker build . --file Dockerfile --tag image
          docker run --rm image /usr/bin/caddy version

      - name: Log into registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          VERSION="$(date +%Y.%m.%d)"
          echo IMAGE_ID="$IMAGE_ID"
          echo VERSION="$VERSION"
          docker tag image "$IMAGE_ID:$VERSION"
          docker push "$IMAGE_ID:$VERSION"
          docker tag "$IMAGE_ID:$VERSION" "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:latest"

  cleanup:
    needs: test_and_push
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Package cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: 5
        run: |
          set -euo pipefail

          gh api --paginate \
            "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            --jq '
              .[]
              | select((.metadata.container.tags // []) | index("latest") | not)
              | .id
            ' |
            tail -n +"$((KEEP + 1))" |
            while read -r id; do
              echo "Deleting package version $id"
              gh api \
                --method DELETE \
                "/users/$OWNER/packages/container/$PACKAGE/versions/$id"
            done
